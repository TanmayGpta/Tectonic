# Observability stack for Tectonic (separate from the root docker-compose.yml demo target).
# Run from repo root:  docker compose -f monitoring/docker-compose.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tectonic-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    # Lets Prometheus scrape the Streamlit console's :8000/metrics on the host/WSL
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: tectonic-pushgateway
    ports:
      - "9091:9091"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: tectonic-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-tectonic}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/tectonic.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3009:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
