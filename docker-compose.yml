version: '3.8'

services:
  tectonic-dashboard:
    build: .
    container_name: tectonic-app
    command: streamlit run dashboard.py --server.address=0.0.0.0
    ports:
      "8501:8501"
    volumes:
      # Mount the local codebase for live-reloading during development
      - .:/app
      
      # CRITICAL: Mount the Docker socket!
      # This is "Docker-out-of-Docker". It allows the Tectonic container to command 
      # the Host machine's Docker Engine to spin up the Sandbox containers.
      - /var/run/docker.sock:/var/run/docker.sock
    
    # Allow the container to communicate with Ollama running on the Windows host
    extra_hosts:
      - "host.docker.internal:host-gateway"
