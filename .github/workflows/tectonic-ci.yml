name: Tectonic CI/CD Infrastructure Validator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-infrastructure:
    name: Lint & Validate Infrastructure as Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Engine
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Specifications
        id: compose_check
        run: |
          echo "🔍 Validating docker-compose.yml syntax and schema..."
          if [ -f "docker-compose.yml" ]; then
            docker-compose -f docker-compose.yml config || exit 1
          fi

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Validate Terraform Manifests
        id: tf_check
        run: |
          echo "🔍 Validating Terraform HCL syntax and formatting..."
          if [ -f "main.tf" ]; then
            terraform fmt -check main.tf || exit 1
            terraform validate || exit 1
          fi

      - name: Tectonic Self-Healing Hook (On Failure)
        if: failure()
        run: |
          echo "🚨 CI/CD Failure Detected! Dispatching incident webhook to Tectonic Agentic Engine..."
          echo "Target manifest failed pre-flight verification."
          # Webhook payload triggers Tectonic autonomous remediation loop
